services:
  - type: web
    name: proposai-api
    runtime: python
    rootDir: rfp-generator/backend
    # Embeddings are hosted (Google), so torch/sentence-transformers are not
    # installed and the service fits in the free plan's 512 MB.
    plan: free
    buildCommand: pip install -r requirements.txt
    # Render injects PORT; binding to it is required or the service is marked unhealthy.
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Secrets — set these in the Render dashboard, never in this file.
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Used for the RAG embeddings (models/embedding-001)
      - key: GEMINI_API_KEY
        sync: false
      # Comma-separated Vercel origin(s), e.g. https://proposai.vercel.app
      - key: FRONTEND_ORIGINS
        sync: false
      - key: MONGODB_DB_NAME
        value: proposai
      # Password reset email (Brevo REST API — free plans block SMTP ports).
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: ProposAI
      # Where reset links point, e.g. https://proposai-rho.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: RESET_TOKEN_TTL_MINUTES
        value: "30"
      # Generated once by Render and kept stable across deploys.
      # Changing it signs every user out.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_TTL_HOURS
        value: "168"
      # Don't accept localhost origins in production.
      - key: DISABLE_LOCAL_CORS
        value: "1"
